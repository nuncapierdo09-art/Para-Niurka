Para ti, mi amor.

No sé cuántas veces he abierto este documento intentando escribirte algo. Siempre termino borrándolo porque siento que ninguna palabra alcanza para decirte todo lo que significas para mí. Pero hoy ya no quiero borrar nada. Quiero escribirte exactamente lo que me vaya acordando, porque nuestra historia merece quedarse en algún lugar, y quiero que ese lugar sean estas páginas.

A veces me pongo a pensar en cómo empezó todo y todavía me parece increíble que una historia tan bonita naciera de algo tan simple. Tú llegaste un día al curso donde yo ya estaba. Era un día completamente normal, uno más de clases, de esos que uno cree que va a olvidar. Pero ese terminó siendo el día que cambió mi vida sin que yo lo supiera.

De todos los asientos que había, te sentaste justo detrás de mí. No sé si alguna vez has pensado en eso, pero yo sí. Muchas veces. Porque había un montón de puestos y aun así terminaste sentándote exactamente ahí. Capaz para ti fue una decisión cualquiera, pero para mí terminó siendo el inicio de todo lo que hoy tenemos.

Ese mismo día nos dieron una hoja con una lección. Yo estaba viendo qué tocaba hacer cuando sentí que me tocaste la espalda. Me giré y me preguntaste qué había que hacer en esa hoja. Fue algo tan simple que cualquiera lo habría olvidado al día siguiente, pero yo no. Esa fue la primera vez que me hablaste, y nunca imaginé que esa pregunta iba a terminar convirtiéndose en la historia más bonita de mi vida.

Después de eso empezamos a hablar cada vez más. Al principio era solo por cosas del colegio, por las tareas o por cualquier tontería. Poco a poco nos fuimos molestando, riéndonos por cosas que solo nosotros entendíamos y formando una amistad que, sin darnos cuenta, se volvió una parte muy importante de mis días. Había días en los que llegaba al colegio con ganas de que pasaran rápido las horas, pero bastaba con hablar un rato contigo para que todo cambiara. Me gustaba hacerte reír, me gustaba escucharte hablar y me gustaba que, sin importar el tema, siempre terminábamos conversando de algo.

Y si hago una pausa en todos esos recuerdos, creo que tengo que hablar de una etapa que nunca voy a olvidar: octubre, noviembre y diciembre del 2025. No sé en qué momento dejamos de ser solo dos amigos. No hubo un día exacto en el que dijera "ya me gusta". Simplemente pasó. Empezamos a decirnos lo que nos gustaba del otro. Yo siempre terminaba hablándote de tu sonrisa, porque de verdad me parecía la más bonita. Y tus ojos... nunca te dije todas las veces que me quedaba viéndolos cuando les daba la luz del sol. Se veían tan bonitos que a veces hasta me distraía. Me gustaba cualquier excusa para verte de cerca.

let pages=document.querySelectorAll(".page");
let cur=0;

function escribir(el,text){
  el.textContent="";
  let i=0;
  let it=setInterval(()=>{
    el.textContent+=text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(it);
  },45);
}

escribir(document.getElementById("t1"),textos[0]);

function next(){
  pages[cur].classList.remove("active");
  cur++;
  pages[cur].classList.add("active");
  if(cur<4) escribir(document.getElementById("t"+(cur+1)),textos[cur]);
}

function openLetter(){
