function escribir(el,text){
  el.textContent="";
  let i=0;
  let it=setInterval(()=>{
    el.textContent+=text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(it);
  },45);
}

function next(){
  pages[cur].classList.remove("active");
  cur++;
  pages[cur].classList.add("active");
  if(cur<4) escribir(document.getElementById("t"+(cur+1)),textos[cur]);
}

function openLetter(){
  document.querySelector(".envelope").classList.add("open");
  playMusic();
  setTimeout(()=>{
    cover.style.display="none";
    main.style.display="block";
  },900);
}

function showFinal(){
  document.getElementById("finalMsg").style.display="block";
}

setInterval(()=>{
  const h=document.createElement("div");
  h.className="bg-heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(14+Math.random()*28)+"px";
  h.style.animationDuration=(6+Math.random()*6)+"s";
  background.appendChild(h);
  setTimeout(()=>h.remove(),12000);
},300);
</script>
